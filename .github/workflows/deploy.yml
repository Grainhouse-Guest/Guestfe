on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pandoc/latex

    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Install mustache (to update the date)
        run: apk add ruby && gem install mustache

      - name: Run build script
        run: sh ./build.sh

      - name: Push to another repository
        id: push_directory
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTO_ACTIONS }} # Personal Access Token
        with:
          source-directory: "output"
          destination-github-username: sjk4618
          destination-repository-name: guest
          user-email: ${{ secrets.EMAIL }} # 이메일 대신 유저네임도 가능, 예: hosung77@users.noreply.github.com
          commit-message: ${{ github.event.head_commit.message }}"
          target-branch: main

      - name: Check exported variable (optional)
        run: echo $DESTINATION_CLONED_DIRECTORY
