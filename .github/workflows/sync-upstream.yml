name: Sync To Fork

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check token access
        env:
          GH_TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "Authorization: token ${GH_TOKEN}" \
            https://api.github.com/repos/sjk4618/Guestfe

      - name: Check token identity and permissions
        env:
          GH_TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          token = os.environ["GH_TOKEN"]
          def fetch(url):
            req = urllib.request.Request(
              url,
              headers={"Authorization": f"token {token}"}
            )
            with urllib.request.urlopen(req) as res:
              return json.loads(res.read().decode("utf-8"))
          user = fetch("https://api.github.com/user")
          repo = fetch("https://api.github.com/repos/sjk4618/Guestfe")
          print("token_user:", user.get("login"))
          print("repo_full_name:", repo.get("full_name"))
          print("repo_permissions:", repo.get("permissions"))
          PY

      - name: Push to fork
        env:
          GH_TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: |
          git remote add fork https://x-access-token:${GH_TOKEN}@github.com/sjk4618/Guestfe.git
          git fetch fork dev:refs/remotes/fork/dev
          git push fork dev:dev --force-with-lease=refs/remotes/fork/dev
