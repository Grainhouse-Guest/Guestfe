name: Sync To Fork

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to fork
        env:
          GH_TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: |
          git remote add fork https://x-access-token:${GH_TOKEN}@github.com/sjk4618/Guestfe.git
          git fetch fork dev:refs/remotes/fork/dev || true
          if git show-ref --verify --quiet refs/remotes/fork/dev; then
            git push fork dev:dev --force-with-lease=refs/remotes/fork/dev
          else
            git push fork dev:dev
          fi
